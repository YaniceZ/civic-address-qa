[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-address-qa"
version = "0.1.0"
description = "Download municipal civic address points from ArcGIS REST services, standardize them to one schema and run data quality checks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yanice Zeng" }]
dependencies = [
    "geopandas>=0.14",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
civic-qa = "civic_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
civic_qa = ["sources.yaml"]

[tool.ruff]
line-length = 125
target-version = "py310"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
